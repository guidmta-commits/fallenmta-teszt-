<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FallenMTA - Főoldal</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigációs sáv -->
    <header class="navbar">
        <div class="logo-container">
            <!-- FallenMTA SVG Logo -->
            <svg class="nav-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 15H80L65 40H52V85H48V40H35L20 15Z" fill="#C53030"/>
                <path d="M28 25H72L61 45H52V75H48V45H39L28 25Z" fill="#E53E3E"/>
            </svg>
            <span class="logo-text">Fallen<span class="logo-mta">MTA</span></span>
        </div>
        <nav class="nav-links">
            <a href="#" class="active">Főoldal</a>
            <a href="#">Hírek</a>
            <a href="#">Kapcsolat</a>
            <a href="#">Fórum</a>
        </nav>
    </header>

    <!-- Fő tartalom (Hero szekció) -->
    <main class="hero-section">
        <div class="hero-content">
            <!-- Nagy középső logó -->
            <div class="hero-logo-wrapper">
                <svg class="main-logo" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 20H105L85 55H68V105H52V55H35L15 20Z" fill="#A72828"/>
                    <path d="M27 28H93L76 58H65V95H55V58H44L27 28Z" fill="#C53030"/>
                </svg>
            </div>

            <h1>Üdvözlünk a <span class="highlight">FallenMTA</span> weboldalán!</h1>
            <p class="subtitle">Egyhelyen minden!</p>

            <!-- Gombok -->
            <div class="hero-buttons">
                <a href="#" class="btn btn-primary">Hírek megtekintése</a>
                <a href="#" class="btn btn-secondary">Discord csatlakozás</a>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
